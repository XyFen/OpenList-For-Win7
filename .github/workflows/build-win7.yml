name: Build OpenList for Windows 7

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标系统架构 (amd64 为 64位，386 为 32位)'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - '386'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取 OpenList 最新源码
        run: |
          REPO_PATH="OpenListTeam/OpenList.git"
          git clone --depth 1 "https://github.com{REPO_PATH}" openlist-src
          ls -la openlist-src

      - name: 2. 下载并集成 OpenList 前端静态页面
        run: |
          cd openlist-src
          mkdir -p public/dist
          FRONTEND_URL=$(curl -fsSL https://github.com | jq -r '.assets[] | select(.name | test("\\.(tar\\.gz|zip)$")) | .browser_download_url' | head -n 1)
          echo "Downloading Frontend: $FRONTEND_URL"
          if [[ "$FRONTEND_URL" == *.zip ]]; then
            curl -fsSL "$FRONTEND_URL" -o dist.zip
            unzip -q dist.zip -d public/dist
          else
            curl -fsSL "$FRONTEND_URL" -o dist.tar.gz
            tar -zxf dist.tar.gz -C public/dist
          fi
          ls -la public/dist

      - name: 3. 下载并配置 XTLS/go-win7 编译器
        run: |
          GO_WIN7_URL=$(curl -fsSL https://github.com | jq -r '.assets[] | select(.name == "go-for-win7-linux-amd64.zip") | .browser_download_url' | head -n 1)
          echo "Downloading XTLS/go-win7: $GO_WIN7_URL"
          curl -fsSL "$GO_WIN7_URL" -o go-win7.zip
          mkdir -p "$HOME/go-win7-sdk"
          unzip -q go-win7.zip -d "$HOME/go-win7-sdk"
          echo "$HOME/go-win7-sdk/go/bin" >> $GITHUB_PATH
          echo "GOROOT=$HOME/go-win7-sdk/go" >> $GITHUB_ENV

      - name: 4. 交叉编译 Windows 7 专属版本
        working-directory: ./openlist-src
        run: |
          which go
          go version
          export GOOS=windows
          export GOARCH=${{ github.event.inputs.arch || 'amd64' }}
          export CGO_ENABLED=0
          
          VERSION=$(git describe --abbrev=0 --tags 2>/dev/null || echo "v4.2.9-win7")
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S')
          
          go build -trimpath -ldflags="-s -w -buildid= \
            -X '://github.com{VERSION}-win7' \
            -X '://github.com{BUILD_TIME}'" \
            -o openlist-windows-${GOARCH}-win7.exe .
          ls -lh openlist-windows-${GOARCH}-win7.exe

      - name: 5. 打包上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: openlist-windows-${{ github.event.inputs.arch || 'amd64' }}-win7
          path: openlist-src/openlist-windows-*-win7.exe
          retention-days: 7
